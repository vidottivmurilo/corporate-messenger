services:
  postgres:
    image: postgres:16-alpine
    container_name: corporate-messenger-db
    environment:
      POSTGRES_USER: messenger_user
      POSTGRES_PASSWORD: messenger_password
      POSTGRES_DB: corporate_messenger
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger_user -d corporate_messenger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
